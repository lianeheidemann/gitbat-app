name: APK para testes

# Um APK só, rápido, para instalar e testar no celular — sem os testes (o CI
# já roda), sem APKs por arquitetura, universal nem AAB.
#
# Dispara manualmente: aba Actions -> "APK para testes" -> Run workflow,
# escolhendo a branch. O APK sai num pré-lançamento (não vira o "Latest"),
# com o nome da branch e o número do run.
#
# Só arm64-v8a: é a arquitetura de praticamente todo celular Android atual,
# e compilar uma só é o que deixa este workflow bem mais curto que o Release.
# Assina com a mesma chave do Release quando os segredos existem, então dá
# para instalar por cima da versão publicada sem desinstalar.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Mesma versão fixada no ci.yml e no release.yml.
env:
  FLUTTER_VERSION: '3.47.0'

concurrency:
  group: apk-testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK de teste
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Definir nome e versão
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # versionCode igual ao do último Release: instala por cima dele (o
          # Android recusa número menor), e o próximo Release, com número
          # maior, instala por cima deste.
          CODIGO=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml --limit 1 --json number --jq '.[0].number' \
            2>/dev/null || true)
          case "$CODIGO" in ''|*[!0-9]*) CODIGO=1 ;; esac
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          NOME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          # Branch sem "/" para caber no nome do arquivo e da tag.
          RAMO=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          echo "ramo=$RAMO" >> "$GITHUB_OUTPUT"
          echo "tag=teste-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "titulo=APK de teste ${GITHUB_RUN_NUMBER} ($RAMO)" >> "$GITHUB_OUTPUT"

      - name: Preparar o keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem segredos de assinatura: o APK sai assinado com a chave de depuração."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          PROPS

      - name: Compilar o APK
        run: |
          mkdir -p entrega
          flutter build apk --release --target-platform android-arm64 \
            --build-name="${{ steps.versao.outputs.nome }}" \
            --build-number=${{ steps.versao.outputs.codigo }}
          cp build/app/outputs/flutter-apk/app-release.apk \
             "entrega/video-em-gif-teste-${GITHUB_RUN_NUMBER}-${{ steps.versao.outputs.ramo }}.apk"
          ls -lh entrega/

      - name: Apagar o keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

      - name: Publicar como pré-lançamento
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: ${{ steps.versao.outputs.titulo }}
          target_commitish: ${{ github.sha }}
          files: entrega/*
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false

name: Release

# Publica APKs num Release do GitHub.
#
# Dispara de dois jeitos:
#   1. empurrando uma tag de versão:  git tag v1.0.0 && git push origin v1.0.0
#   2. manualmente, na aba Actions -> Release -> Run workflow
#
# Assinatura: se os segredos do keystore estiverem configurados (veja
# docs/PUBLICAR_NA_PLAY_STORE.md), os APKs saem assinados com a sua chave de
# upload e o AAB da Play Store também é gerado. Sem os segredos o workflow
# continua funcionando, mas assina com a chave de depuração — serve para
# instalar e testar, NÃO serve para enviar à Play Store.

on:
  push:
    tags: ['v*']
    branches: ['main']
    paths:
      - 'pubspec.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (ex.: 1.0.0). Se vazio, usa a do pubspec.yaml.'
        required: false
        type: string

permissions:
  contents: write

# Mesma versão fixada no ci.yml: o APK publicado tem que sair do mesmo
# toolchain que passou nos testes.
env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  build:
    name: Compilar e publicar
    # Versão fixa: subir para a próxima LTS é decisão manual, não automática.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Cache do Gradle entre execuções: as partes que não mudaram desde o
      # último build vêm prontas (mesmo cache do "APK para testes").
      - name: Configurar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Testes
        run: flutter test

      - name: Definir a versão
        id: versao
        run: |
          if [ -n "${{ inputs.versao }}" ]; then
            NOME="${{ inputs.versao }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NOME="${GITHUB_REF_NAME#v}"
          else
            NOME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          fi
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          echo "codigo=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

          # A tag do release precisa ser única a cada execução — sem isso,
          # rodar de novo sem mudar a versão em pubspec.yaml sobrescrevia o
          # release anterior (mesma tag "vX.Y.Z") em vez de criar um novo, e
          # o APK antigo sumia do histórico. Disparando por uma tag de
          # verdade (`git tag vX.Y.Z && git push`) ela já garante isso
          # sozinha; nos outros dois gatilhos (push em main/workflow_dispatch)
          # o número do run entra no final da tag para diferenciar. O nome
          # de exibição (nomes dos arquivos) continua limpo, só com
          # a versão — só a tag e o título do release ganham o "(build N)".
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            TITULO="GitBat $NOME"
          else
            TAG="v$NOME-${GITHUB_RUN_NUMBER}"
            TITULO="GitBat $NOME (build ${GITHUB_RUN_NUMBER})"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "titulo=$TITULO" >> "$GITHUB_OUTPUT"
          echo "Versão $NOME (versionCode ${GITHUB_RUN_NUMBER}, tag $TAG)"

      - name: Preparar o keystore
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem segredos de assinatura: os APKs sairão assinados com a chave de depuração."
            echo "assinado=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          PROPS
          echo "assinado=sim" >> "$GITHUB_OUTPUT"

      - name: Compilar APKs por arquitetura
        run: |
          V="${{ steps.versao.outputs.nome }}"
          mkdir -p entrega
          flutter build apk --release --split-per-abi \
            --build-name="$V" \
            --build-number=${{ steps.versao.outputs.codigo }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "entrega/gitbat-$V-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "entrega/gitbat-$V-armeabi-v7a.apk"

      - name: Compilar APK universal
        run: |
          V="${{ steps.versao.outputs.nome }}"
          flutter build apk --release \
            --build-name="$V" \
            --build-number=${{ steps.versao.outputs.codigo }}
          cp build/app/outputs/flutter-apk/app-release.apk \
             "entrega/gitbat-$V-universal.apk"

      - name: Compilar AAB para a Play Store
        if: steps.chave.outputs.assinado == 'sim'
        run: |
          V="${{ steps.versao.outputs.nome }}"
          flutter build appbundle --release \
            --build-name="$V" \
            --build-number=${{ steps.versao.outputs.codigo }}
          cp build/app/outputs/bundle/release/app-release.aab \
             "entrega/gitbat-$V.aab"

      - name: Listar o que será publicado
        run: ls -lh entrega/

      - name: Apagar o keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

      - name: Publicar o Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: ${{ steps.versao.outputs.titulo }}
          files: entrega/*
          fail_on_unmatched_files: true
          # Sem isto a action só marca o "Latest" quando ela CRIA a linha do
          # release. Reaproveitando uma tag que já existe, ela troca os APKs e
          # o texto mas deixa o selo onde estava — foi assim que a barra
          # lateral do repositório ficou presa numa versão antiga enquanto os
          # runs saíam verdes.
          make_latest: true
          # Sem `body`: o release mostra só o título e os arquivos, sem texto
          # descritivo.

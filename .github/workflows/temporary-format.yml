name: Temporary Dart formatter

on:
  push:
    branches:
      - novas-paletas-v2
    paths:
      - lib/app/app_palette.dart
      - .github/workflows/temporary-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: novas-paletas-v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Format palette file
        run: dart format lib/app/app_palette.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/app_palette.dart
          git commit -m "style: format new palettes"
          git push

name: Formatar detalhes uma vez

on:
  push:
    branches: [paletas-de-cores]
    paths:
      - lib/features/home/widgets/palette_corner_decoration.dart
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  formatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paletas-de-cores
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Formatar e publicar
        run: |
          dart format lib/features/home/widgets/palette_corner_decoration.dart
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/home/widgets/palette_corner_decoration.dart
          git commit -m "Formata detalhes decorativos"
          git push origin HEAD:paletas-de-cores

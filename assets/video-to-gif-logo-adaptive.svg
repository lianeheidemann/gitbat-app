<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="GitBat">
  <defs>
    <linearGradient id="brand" x1="90" y1="60" x2="540" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A66CFF"/>
      <stop offset="1" stop-color="#6930C3"/>
    </linearGradient>
    <style>
      .primary{fill:url(#brand)}
      .surface{fill:#FFFFFF;stroke:#6F36B8;stroke-width:9}
      .ghost1{fill:#DCC8F5;stroke:#8E5BC9;stroke-width:7}
      .ghost2{fill:#C5A3EC;stroke:#8050BD;stroke-width:7}
      .gif{fill:#5B249F;font:800 76px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:-3px}
      .cutout{fill:#FFFFFF}
      @media (prefers-color-scheme:dark){
        .surface{fill:#24172F;stroke:#C49AF4}
        .ghost1{fill:#49305E;stroke:#A779D6}
        .ghost2{fill:#654283;stroke:#B88BE7}
        .gif{fill:#F4E9FF}
        .cutout{fill:#0D1117}
      }
    </style>
  </defs>

  <!-- Transparent canvas: no enclosing square -->
  <g transform="translate(46 50)">
    <!-- Film strip -->
    <rect class="primary" x="0" y="10" width="190" height="200" rx="42"/>
    <rect class="cutout" x="53" y="38" width="84" height="61" rx="15"/>
    <rect class="cutout" x="53" y="121" width="84" height="61" rx="15"/>
    <g class="cutout">
      <rect x="18" y="35" width="20" height="24" rx="6"/><rect x="152" y="35" width="20" height="24" rx="6"/>
      <rect x="18" y="76" width="20" height="24" rx="6"/><rect x="152" y="76" width="20" height="24" rx="6"/>
      <rect x="18" y="117" width="20" height="24" rx="6"/><rect x="152" y="117" width="20" height="24" rx="6"/>
      <rect x="18" y="158" width="20" height="24" rx="6"/><rect x="152" y="158" width="20" height="24" rx="6"/>
    </g>

    <!-- Conversion arrow -->
    <path class="primary" d="M213 86h56V58c0-8 9-12 15-7l55 51c5 5 5 13 0 18l-55 51c-6 5-15 1-15-7v-28h-56c-12 0-21-10-21-22v-6c0-12 9-22 21-22Z"/>

    <!-- Animated-frame stack -->
    <rect class="ghost2" x="384" y="12" width="162" height="174" rx="39"/>
    <rect class="ghost1" x="360" y="30" width="162" height="174" rx="39"/>
    <rect class="surface" x="330" y="52" width="170" height="170" rx="42"/>
    <text class="gif" x="415" y="164" text-anchor="middle">GIF</text>
  </g>
</svg>

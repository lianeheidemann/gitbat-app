<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="92" viewBox="0 0 1540 92" role="img" aria-labelledby="title desc">
  <title id="title">Badges de tecnologias do projeto</title>
  <desc id="desc">Flutter, Dart, Android, FFmpeg e licença proprietária, em paleta azul e ciano adaptável ao tema claro e escuro.</desc>
  <style>
    :root { color-scheme: light dark; }
    .card { fill:#F7FAFF; stroke:#4F8FFF; stroke-width:2.4; }
    .title { fill:#101B33; font:700 20px Inter,Segoe UI,Arial,sans-serif; }
    .sub { fill:#52627C; font:500 16px Inter,Segoe UI,Arial,sans-serif; }
    .blue { fill:#5B9CFF; }
    .cyan { fill:#20D5E8; }
    .line-blue { fill:none; stroke:#5B9CFF; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    @media (prefers-color-scheme: dark) {
      .card { fill:#111A2D; stroke:#48A7FF; }
      .title { fill:#F4F8FF; }
      .sub { fill:#B8C8E2; }
      .blue { fill:#66A7FF; }
      .cyan { fill:#24D7E7; }
      .line-blue { stroke:#66A7FF; }
    }
  </style>

  <g transform="translate(1 1)">
